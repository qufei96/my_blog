<h2>您喜欢哪种设计风格？</h2>
<p class="subtitle">选择最符合您个人风格的视觉方向</p>

<div class="cards">
  <div class="card" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: #fafafa; padding: 20px;">
        <div style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
          <div style="font-size: 18px; font-weight: 300; color: #333;">博客标题</div>
        </div>
        <div style="color: #666; font-size: 12px; margin-bottom: 8px;">2024年1月15日</div>
        <div style="color: #333; font-size: 14px; line-height: 1.6;">
          简洁的文字内容，大量留白，专注阅读体验...
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>极简风格</h3>
      <p>大量留白、简洁排版、专注内容阅读</p>
    </div>
  </div>

  <div class="card" data-choice="modern" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: white;">
        <div style="font-size: 20px; font-weight: 600; margin-bottom: 15px;">博客标题</div>
        <div style="background: rgba(255,255,255,0.2); border-radius: 8px; padding: 12px; margin-bottom: 10px;">
          <div style="font-size: 14px; opacity: 0.8;">文章标题</div>
        </div>
        <div style="background: rgba(255,255,255,0.2); border-radius: 8px; padding: 12px;">
          <div style="font-size: 14px; opacity: 0.8;">另一篇文章</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>现代渐变</h3>
      <p>大胆配色、渐变背景、卡片式布局</p>
    </div>
  </div>

  <div class="card" data-choice="classic" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: #fff; border: 1px solid #ddd; padding: 20px;">
        <div style="border-bottom: 3px double #333; padding-bottom: 10px; margin-bottom: 15px; text-align: center;">
          <div style="font-size: 18px; font-weight: 700; color: #333; font-family: Georgia, serif;">博客标题</div>
        </div>
        <div style="color: #555; font-size: 13px; font-family: Georgia, serif; line-height: 1.7;">
          传统排版风格，衬线字体，优雅经典...
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>经典文学</h3>
      <p>衬线字体、传统排版、优雅文学气息</p>
    </div>
  </div>

  <div class="card" data-choice="creative" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: #1a1a2e; padding: 20px; color: #eaeaea;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <div style="font-size: 18px; font-weight: 700; color: #00d9ff;">博客</div>
          <div style="display: flex; gap: 10px; font-size: 11px;">
            <span style="color: #ff6b6b;">标签1</span>
            <span style="color: #ffd93d;">标签2</span>
          </div>
        </div>
        <div style="border-left: 3px solid #00d9ff; padding-left: 12px; color: #ccc; font-size: 13px;">
          创意布局，独特配色，个性十足...
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>创意个性</h3>
      <p>独特配色、非对称布局、强烈个人风格</p>
    </div>
  </div>
</div>
