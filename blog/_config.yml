# Site
title: 比奇堡热心市民
subtitle: 记录生活与技术的点滴
description: 比奇堡热心市民的个人博客
author: 比奇堡热心市民
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://qufei96.github.io/my_blog/
root: /my_blog/
permalink: posts/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link: true
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: citizen

# Search
search:
  path: search.xml
  field: post
  format: html
  limit: 10000

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:

# Deployment
deploy:
  type: ''
